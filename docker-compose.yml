services:
  mysql:
    image: mysql:8.0
    container_name: vihva-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: vihva
      MYSQL_USER: vihva_user
      MYSQL_PASSWORD: vihva123

    ports:
      - "3307:3306"

    volumes:
      - vihva_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vihva_mysql_data: