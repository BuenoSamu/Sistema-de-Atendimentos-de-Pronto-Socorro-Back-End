name: sistema-de-atendimentos-de-pronto-socorro-back-end

services:
  database:
    image: mysql:8.0
    container_name: vihva-database

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME:-vihva}
      MYSQL_USER: ${DB_USER:-vihva_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - vihva_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vihva_mysql_data: